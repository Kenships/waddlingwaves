
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Personality Profiler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // Tailwind Configuration
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DuckCustom', 'Quicksand', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'DuckCustom';
            src: url('./src/assets/EmilysFont-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        },
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
            margin: 0;
            color: #0f172a;
        }
        .duck-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #2dd4bf 100%);
        }
        /* Custom scrollbar for a nicer look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f9ff;
        }
        ::-webkit-scrollbar-thumb {
            background: #bae6fd;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7dd3fc;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@^19.2.4",
            "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
            "react/": "https://esm.sh/react@^19.2.4/",
            "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
          }
        }
    </script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<!-- This tag is essential for Vite to find your code -->
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
